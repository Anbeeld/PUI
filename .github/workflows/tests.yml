name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Complete Node test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run release:validate
      - name: Verify release tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME must equal v$VERSION" >&2
            exit 1
          fi
      - name: Verify exact Pi Web integration fixture
        run: npm run release:verify-pi-web
      - name: "Verify exact Pi #8782 runtime backport artifact"
        run: npm run release:verify-pi-8782
      - name: Verify exact published prompt patch artifacts
        run: npm run release:verify-prompt-patches

  windows-static:
    name: Windows static checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse check
        shell: pwsh
        run: |
          foreach ($f in @("install.ps1","update.ps1","uninstall.ps1","doctor.ps1")) {
            $tokens = $null; $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$f", [ref]$tokens, [ref]$errs)
            if ($errs) { throw "Parse failure in ${f}: $($errs[0].Message)" }
          }
      - name: Complete Node test suite
        shell: pwsh
        run: npm test

  macos-static:
    name: macOS static checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: bash syntax check
        run: |
          for f in install.sh update.sh uninstall.sh doctor.sh; do
            bash -n "$f"
          done
      - name: Complete Node test suite
        run: npm test

  linux-static:
    name: Linux static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: bash syntax check
        run: |
          for f in install.sh update.sh uninstall.sh doctor.sh; do
            bash -n "$f"
          done
      - name: OS detection check
        run: |
          # Verify install.sh detects Linux correctly (dry parse, no execution)
          grep -q 'Darwin) OS_NAME="macOS"' install.sh
          grep -q 'Linux)  OS_NAME="Linux"' install.sh
      - name: Complete Node test suite
        run: npm test
